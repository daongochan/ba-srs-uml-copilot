name: CI Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Checks
        run: ruff check .

  security:
    name: Security Gate (Gitleaks & Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Dependency Vulnerability Audit
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112899

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, security]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Syntax Check
        run: python -m compileall -q src tests

      - name: Run Pytest Test Suite with Coverage
        env:
          GEMINI_API_KEY: "mock_api_key_for_ci_pipeline"
        run: |
          pytest
